    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = localStorage.getItem('portfolio-theme')
        var theme =
          t === 'light' || t === 'dark'
            ? t
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.classList.add(theme)
      })()
    </script>
